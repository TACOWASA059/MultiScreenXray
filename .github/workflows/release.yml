name: Release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Read project versions
        id: versions
        shell: bash
        run: |
          echo "java=$(sed -n 's/^java_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
          echo "mod=$(sed -n 's/^version=//p' gradle.properties | head -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}
          cache: gradle

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish Modrinth and CurseForge files
        run: ./gradlew publishMods --stacktrace

      - name: Publish GitHub release
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-generate-changelog: true
          files: |
            fabric/build/libs/!(*-@(sources|javadoc)).jar
            forge/build/libs/!(*-@(sources|javadoc)).jar
            neoforge/build/libs/!(*-@(sources|javadoc)).jar
          name: MultiScreen X-ray ${{ steps.versions.outputs.mod }} for Minecraft ${{ steps.versions.outputs.minecraft }}
          version: ${{ github.ref_name }}
          version-type: release
          game-versions: ${{ steps.versions.outputs.minecraft }}
          environment: client
